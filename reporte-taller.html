<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Informe Taller - Predicar</title>

    <link
        rel="stylesheet"
        href="reporte.css"
    >

</head>


<body>

<div id="reporte">


    <!-- ===================== PORTADA ===================== -->

    <section class="portada">

        <div class="encabezado">

            <div class="logo-area">

                <img
                    id="logoTaller"
                    class="logo"
                    alt="Logo del taller"
>

            </div>


            <div class="empresa">

                <h1>
                    PREDICAR AUTOMOTIVE PERÚ SAC
                </h1>

                <p>
                    <b>RUC:</b>
                    20615964850
                </p>

                <h2>
                    INFORME DE INSPECCIÓN - TALLER
                </h2>

                <p>
                    <b>N° Inspección:</b>
                    <span id="numeroInspeccion"></span>
                </p>

                <p>
                    <b>Fecha:</b>
                    <span id="fechaReporte"></span>
                </p>

                <p>
                    <b>Taller:</b>
                    <span id="nombreTaller"></span>
                </p>

                <p>
                    <b>jefetaller:</b>
                    <span id="Jefe de taller"></span>
                </p>

            </div>

        </div>


        <section id="datos"></section>

    </section>



    <!-- ===================== CARROCERÍA ===================== -->

    <section class="seccion">

        <section id="carroceria"></section>

    </section>



    <!-- ===================== VOZ DEL CLIENTE ===================== -->

    <section class="seccion">

        <section id="vozCliente"></section>

    </section>



    <!-- ===================== ESTADO INICIAL ===================== -->

    <section class="seccion">

        <section id="estadoInicial"></section>

    </section>



    <!-- ===================== PRUEBA DE MANEJO ===================== -->

    <section class="seccion">

        <section id="pruebaManejo"></section>

    </section>



    <!-- ===================== ESTADO FINAL ===================== -->

    <section class="seccion">

        <section id="estadoFinal"></section>

    </section>



    <!-- ===================== CONCLUSIÓN ===================== -->

    <section class="seccion">

        <section id="conclusion"></section>

    </section>



    <!-- ===================== CLIENTE ===================== -->

    <section class="seccion">

        <section id="cliente"></section>

    </section>



    <!-- ===================== RESUMEN ===================== -->

    <section class="seccion">

        <section id="resumen"></section>

    </section>


</div>



<div class="no-print">

    <button onclick="window.print()">

        📄 Descargar PDF

    </button>

</div>


<script src="reporte-taller.js"></script>

</body>

</html>
